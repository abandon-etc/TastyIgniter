name: CI Pipeline

on: [ push, pull_request, workflow_dispatch ]

jobs:
  php-tests:
    name: PHP Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: [ 8.3, 8.4, 8.5 ]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: citest
          MYSQL_DATABASE: igniter_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pcitest --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: igniter_test
      DB_USERNAME: root
      DB_PASSWORD: citest
      DB_PREFIX: ti_
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none
          extensions: bcmath, curl, exif, gd, intl, mbstring, opcache, pdo_mysql, zip

      - name: Install composer dependencies
        # The tastyigniter.com registry's dist zips fail lock-file checksum
        # verification (first run, 2026-08-28); Dockerfile.cloudrun works
        # around the same issue the same way: install tastyigniter/* from
        # source.
        run: |
          composer config --no-plugins --no-scripts "preferred-install.tastyigniter/*" source
          composer install --no-interaction --no-progress

      - name: Generate application key
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Migrate the throwaway test database
        # The suite asserts against a migrated schema and does not migrate
        # by itself (run 2: 75 errors + 3 failures, all missing-table).
        # igniter:up runs the system and extension migrations. This is also
        # the first place the recorded fresh-install migration-ordering
        # defect can reproduce; if it does, that is a finding, not a CI
        # bug.
        run: php artisan igniter:up

      - name: Run test suite
        run: vendor/bin/phpunit --no-coverage
