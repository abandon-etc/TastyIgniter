services:
  app:
    build:
      context: .
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: tastyigniter
      DB_USERNAME: tastyigniter
      DB_PASSWORD: tastyigniter

  mysql:
    image: mariadb:10.11
    ports:
      - "33060:3306"
    environment:
      MYSQL_DATABASE: tastyigniter
      MYSQL_USER: tastyigniter
      MYSQL_PASSWORD: tastyigniter
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - tastyigniter-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  tastyigniter-mysql-data:
